<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowstate OS — Heart Material Engine v1 (Equilibrium v0.4.3)</title>
<style>
  :root {
    --bg: #0a0a0c;
    --ink-secondary: #6b6f76;
    --ink-tertiary: #3a3d42;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: -apple-system, "Manrope", system-ui, sans-serif;
  }
  #stage {
    position: relative; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #equilibrium-svg { width: 340px; height: 340px; display: block; overflow: visible; }
  #glow-layer { mix-blend-mode: screen; }
  #debug-panel {
    position: fixed; bottom: 20px; left: 20px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 16px 18px; font-size: 12px;
    color: var(--ink-secondary); width: 260px; backdrop-filter: blur(6px);
    max-height: 80vh; overflow-y: auto;
  }
  #debug-panel.hidden { display: none; }
  #debug-panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: #fff; margin: 0 0 12px 0; font-weight: 600;
  }
  .control { margin-bottom: 12px; }
  .control label { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .control span { color: #1f8a55; font-variant-numeric: tabular-nums; }
  .control input[type="range"] { width: 100%; accent-color: #1f8a55; }
  .section-divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 14px 0; }
  #hint {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    color: var(--ink-tertiary); font-size: 13px; letter-spacing: 0.02em;
  }
  #version-tag {
    position: fixed; top: 20px; right: 24px; color: var(--ink-tertiary);
    font-size: 11px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

  <div id="hint">move your cursor near the shape — press "h" to hide panel</div>
  <div id="version-tag">Heart Material Engine v1 · Equilibrium v0.4.3</div>

  <div id="stage">
    <svg id="equilibrium-svg" viewBox="0 0 340 340">
      <defs>
        <clipPath id="droplet-clip"><path id="droplet-clip-path" d=""></path></clipPath>
        <radialGradient id="glow-blob">
          <stop offset="0%" stop-color="#e8fff2" stop-opacity="1" />
          <stop offset="100%" stop-color="#e8fff2" stop-opacity="0" />
        </radialGradient>
      </defs>
      <path id="droplet-path" d="" fill="hsl(152, 60%, 32%)"></path>
      <g id="glow-layer" clip-path="url(#droplet-clip)"></g>
    </svg>
  </div>

  <div id="debug-panel">
    <h2>Tuning — Physics (unchanged)</h2>
    <div class="control"><label>Stiffness (k) <span id="val-stiffness"></span></label>
      <input type="range" id="stiffness" min="10" max="400" step="1"></div>
    <div class="control"><label>Damping (c) <span id="val-damping"></span></label>
      <input type="range" id="damping" min="1" max="60" step="0.5"></div>
    <div class="control"><label>Impulse strength <span id="val-impulse"></span></label>
      <input type="range" id="impulse" min="0" max="6" step="0.05"></div>
    <div class="control"><label>Idle noise amplitude <span id="val-noise"></span></label>
      <input type="range" id="noise" min="0" max="20" step="0.5"></div>
    <div class="control"><label>Influence radius <span id="val-influence"></span></label>
      <input type="range" id="influence" min="60" max="500" step="5"></div>
    <div class="control"><label>Falloff exponent <span id="val-falloff"></span></label>
      <input type="range" id="falloff" min="1" max="6" step="0.1"></div>

    <hr class="section-divider">
    <h2>Tuning — Material Engine (v0.4.0)</h2>
    <div class="control"><label>Attack rate <span id="val-lumattack"></span></label>
      <input type="range" id="lumattack" min="0.02" max="0.5" step="0.01"></div>
    <div class="control"><label>Release rate <span id="val-lumrelease"></span></label>
      <input type="range" id="lumrelease" min="0.005" max="0.2" step="0.005"></div>
    <div class="control"><label>Diffusion rate <span id="val-lumdiffusion"></span></label>
      <input type="range" id="lumdiffusion" min="0" max="0.4" step="0.01"></div>
    <div class="control"><label>Glow radius <span id="val-glowradius"></span></label>
      <input type="range" id="glowradius" min="15" max="120" step="1"></div>
    <div class="control"><label>Ambient radius <span id="val-ambientradius"></span></label>
      <input type="range" id="ambientradius" min="60" max="220" step="5"></div>
    <div class="control"><label>Cursor glow radius <span id="val-cursorglowradius"></span></label>
      <input type="range" id="cursorglowradius" min="40" max="300" step="5"></div>
    <div class="control"><label>Cursor follow lag <span id="val-cursorfollowlag"></span></label>
      <input type="range" id="cursorfollowlag" min="0.05" max="0.6" step="0.01"></div>
  </div>

<script>
/* ============================================================================
   FLOWSTATE OS — EQUILIBRIUM
   v0.4.0 — MATERIAL ENGINE
   ----------------------------------------------------------------------------
   CHANGELOG (v0.3.0 -> v0.4.0) — architectural, not visual.

   v0.3.0 already had a per-point luminosity field, but the field logic
   was inlined directly inside stepPhysics(), reading pointerPos/falloff
   itself. That's fine for one droplet, but it isn't a foundation anything
   else (waves, veins, ink, fabric, particles) could reuse — the "engine"
   and "this one component's use of it" were the same code.

   v0.4.0 extracts MaterialField as a standalone, geometry-agnostic,
   input-agnostic class:
     - inject(index, amount) — something ADDS energy at a location.
       MaterialField doesn't know or care what that something is (a
       cursor, a collision, another material, a scripted event).
     - step() — advances attack/release + neighbor diffusion by one
       fixed tick. No knowledge of physics, geometry, or rendering.
     - get(index) / average() — the ONLY way anything reads state out.

   Enforced separation, not just organizational: stepPhysics() computes
   WHERE and HOW MUCH to inject (still using the existing cursor/
   alignment/falloff math — unchanged), then calls field.inject(). It
   never touches field.state directly. render() calls field.get()/
   average() only — it has no reference to pointerPos, pointerVel, or
   distToPointer at all. The renderer cannot ask "where is the cursor,"
   structurally, because it has no path to that information anymore.

   This is the reusable unit: a future "ink" material would instantiate
   its own MaterialField and inject from a different source (e.g. drag
   velocity); a "fabric" material could run several fields (stretch,
   wear) over the same point set. The engine itself doesn't change.

   PRESERVED UNCHANGED: spring/damping physics, geometry, Catmull-Rom
   rendering, idle noise, input adapter, falloff/alignment calculation.
   NOT ADDED: bloom, rim lighting, edge highlights, or any decorative
   effect — same glow-blob + clip + screen-blend rendering as v0.3.0.
   CHANGELOG (v0.4.0 -> v0.4.1)
   No functional change. This version tag formally marks "Heart Material
   Engine v1" as complete: cursor-following rendering is fully removed,
   MaterialField (inject/step/get/average) is the sole source of truth
   the renderer reads, and diffusion is already wired for v0.3's wave
   propagation to build on directly.
   CHANGELOG (v0.4.1 -> v0.4.2)
   Single isolated change: material.inject() now uses per-point distance
   to the cursor's actual position, instead of alignment (facing
   direction) combined with shape-center distance. The cursor can now
   inject energy anywhere near the surface — including over the
   interior/center — not just where a point's outward direction happens
   to face it. This restores the "cursor is the source of truth"
   precision of the old flashlight, while everything it feeds into
   (persistence, decay, diffusion, the renderer reading only field
   state) is unchanged from v0.4.1. Mechanical deformation/impulse is
   untouched — this only affects what MaterialField.inject() receives.
   CHANGELOG (v0.4.2 -> v0.4.3)
   The ring field's glow blobs are permanently anchored to the 14 fixed
   points on the perimeter — no matter what their values are, light can
   only ever render there. That's why brightness stayed perimeter-bound
   even after v0.4.2 made injection position-based. Added one additional
   glow element with NO fixed anchor: its position lags toward the raw
   cursor location every step (so it can sit anywhere, including deep
   interior), and its magnitude eases via the same attack/release rates
   as everything else. Rendered last (on top) inside the same clipped
   glow-layer group, so it's still strictly bounded by the heart's
   silhouette. Ring field, ring glows, and ambient wash are unchanged.
   ============================================================================ */


  /* --------------------------------------------------------------------
     MATERIAL ENGINE — reusable, geometry- and input-agnostic.
     -------------------------------------------------------------------- */
  class MaterialField {
    constructor(size, { attack, release, diffusion }) {
      this.size = size;
      this.attack = attack;
      this.release = release;
      this.diffusion = diffusion;
      this.state = new Float32Array(size);
      this._next = new Float32Array(size);
      this._targets = new Float32Array(size);
    }

    // Something injects energy at an index. Multiple injections in the
    // same tick take the strongest, not the sum — prevents a future
    // multi-source material (e.g. two touches) from blowing past 1.0.
    inject(index, amount) {
      if (amount > this._targets[index]) this._targets[index] = amount;
    }

    step() {
      const n = this.size;
      for (let i = 0; i < n; i++) {
        const target = this._targets[i];
        const current = this.state[i];
        const rate = target > current ? this.attack : this.release;
        const eased = current + (target - current) * rate;

        const left = this.state[(i - 1 + n) % n];
        const right = this.state[(i + 1) % n];
        const neighborAvg = (left + right) * 0.5;

        this._next[i] = eased + (neighborAvg - eased) * this.diffusion;
      }
      const tmp = this.state;
      this.state = this._next;
      this._next = tmp;
      this._targets.fill(0); // injections are per-tick; caller re-injects every step
    }

    get(index) { return this.state[index]; }

    average() {
      let sum = 0;
      for (let i = 0; i < this.size; i++) sum += this.state[i];
      return sum / this.size;
    }
  }


  /* --------------------------------------------------------------------
     CONFIG
     -------------------------------------------------------------------- */
  const CONFIG = {
    pointCount: 14,
    baseRadius: 80,
    stiffness: 30,
    damping: 12,
    impulseScale: 2.5,
    influenceRadius: 400,
    falloffExponent: 3,
    noiseAmplitude: 3,
    velocitySmoothing: 0.25,
    velocityDecay: 0.90,
    fixedTimestep: 1 / 120,
    lumAttack: 0.14,
    lumRelease: 0.03,
    lumDiffusion: 0.12,
    glowRadius: 55,
    ambientRadius: 130,
    cursorGlowRadius: 150,     // v0.4.3: NEW — radius of the free glow that follows the cursor anywhere on the surface
    cursorFollowLag: 0.22      // v0.4.3: NEW — how tightly it tracks the cursor (lower = more lag)
  };

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) {
    CONFIG.noiseAmplitude = 0;
    CONFIG.impulseScale *= 0.4;
  }

  const material = new MaterialField(CONFIG.pointCount, {
    attack: CONFIG.lumAttack,
    release: CONFIG.lumRelease,
    diffusion: CONFIG.lumDiffusion
  });


  /* --------------------------------------------------------------------
     NOISE (unchanged)
     -------------------------------------------------------------------- */
  function hash1(n) {
    const x = Math.sin(n * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }
  function valueNoise1D(x) {
    const i = Math.floor(x);
    const f = x - i;
    const a = hash1(i);
    const b = hash1(i + 1);
    const u = f * f * (3 - 2 * f);
    return a + (b - a) * u;
  }
  function idleOffset(t, phase) {
    const n1 = valueNoise1D(t * 0.021 + phase) * 2 - 1;
    const n2 = valueNoise1D(t * 0.057 + phase * 1.7) * 2 - 1;
    const n3 = valueNoise1D(t * 0.133 + phase * 2.3) * 2 - 1;
    return (n1 * 1.0 + n2 * 0.5 + n3 * 0.25) / 1.75;
  }


  /* --------------------------------------------------------------------
     POINT STATE (geometry unchanged — no luminosity fields here anymore)
     -------------------------------------------------------------------- */
  const points = [];
  for (let i = 0; i < CONFIG.pointCount; i++) {
    points.push({
      angle: (i / CONFIG.pointCount) * Math.PI * 2,
      offset: 0,
      velocity: 0,
      phase: i * 1.37
    });
  }


  /* --------------------------------------------------------------------
     INPUT ADAPTER (unchanged)
     -------------------------------------------------------------------- */
  const svg = document.getElementById('equilibrium-svg');
  const stage = document.getElementById('stage');
  let pointerPos = { x: 170, y: 170 };
  let pointerVel = { x: 0, y: 0 };
  let lastPointerPos = null;
  let lastPointerTime = null;

  function toLocalCoords(clientX, clientY) {
    const rect = svg.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function handlePointerMove(clientX, clientY) {
    const now = performance.now();
    const pos = toLocalCoords(clientX, clientY);
    if (lastPointerPos && lastPointerTime) {
      const dt = Math.max((now - lastPointerTime) / 1000, 1 / 240);
      const rawVelX = (pos.x - lastPointerPos.x) / dt;
      const rawVelY = (pos.y - lastPointerPos.y) / dt;
      pointerVel.x += (rawVelX - pointerVel.x) * CONFIG.velocitySmoothing;
      pointerVel.y += (rawVelY - pointerVel.y) * CONFIG.velocitySmoothing;
    }
    pointerPos = pos;
    lastPointerPos = pos;
    lastPointerTime = now;
  }

  stage.addEventListener('pointermove', (e) => handlePointerMove(e.clientX, e.clientY));
  stage.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (t) handlePointerMove(t.clientX, t.clientY);
  }, { passive: true });

  let pointerInside = false;

  // v0.4.3: the free glow — not tied to the 14 ring points. Position
  // lags toward the actual cursor location (so it can sit anywhere,
  // including deep interior), magnitude eases via the same attack/
  // release rates as the ring field, for consistent "gathers fast,
  // lingers slow" behavior.
  let cursorEnergy = 0;
  let cursorGlowX = 170;
  let cursorGlowY = 170;
  stage.addEventListener('pointerenter', () => { pointerInside = true; });
  stage.addEventListener('pointerleave', () => { pointerInside = false; });
  stage.addEventListener('touchstart', () => { pointerInside = true; }, { passive: true });
  stage.addEventListener('touchend', () => { pointerInside = false; });
  stage.addEventListener('touchcancel', () => { pointerInside = false; });


  /* --------------------------------------------------------------------
     PHYSICS STEP — deformation unchanged. The only material-related
     call here is field.inject(); everything downstream of that call
     (attack/release/diffusion) lives inside MaterialField, not here.
     -------------------------------------------------------------------- */
  function stepPhysics(t, dt) {
    const cx = 170, cy = 170;
    const dx = pointerPos.x - cx;
    const dy = pointerPos.y - cy;
    const distToPointer = Math.hypot(dx, dy);
    const pointerDirX = distToPointer > 0.001 ? dx / distToPointer : 0;
    const pointerDirY = distToPointer > 0.001 ? dy / distToPointer : 0;
    const pointerSpeed = Math.hypot(pointerVel.x, pointerVel.y);

    const edge = CONFIG.baseRadius;
    const outer = CONFIG.influenceRadius;
    let rawT = (distToPointer - edge) / (outer - edge);
    rawT = Math.max(0, Math.min(1, rawT));
    const proximity = 1 - rawT;
    const falloff = Math.pow(proximity, CONFIG.falloffExponent);

    for (let i = 0; i < points.length; i++) {
      const p = points[i];

      const idleTarget = reducedMotion ? 0 : idleOffset(t, p.phase) * CONFIG.noiseAmplitude;
      const displacement = p.offset - idleTarget;
      const springForce = -CONFIG.stiffness * displacement;
      const dampingForce = -CONFIG.damping * p.velocity;
      let accel = springForce + dampingForce;

      const pointDirX = Math.cos(p.angle);
      const pointDirY = Math.sin(p.angle);
      const alignment = pointDirX * pointerDirX + pointDirY * pointerDirY;
      const inInfluence = alignment > 0 && distToPointer < outer && pointerInside;

      if (inInfluence) {
        accel += pointerSpeed * alignment * falloff * CONFIG.impulseScale;
      }

      p.velocity += accel * dt;
      p.offset += p.velocity * dt;

      // The ONLY place cursor state touches the material: an amount,
      // handed to the field. What happens to it after this call is
      // entirely the field's business.
      // v0.4.2: injection source changed to per-point distance-to-cursor
      // (position-based, like the old flashlight) instead of alignment-
      // gated shape-center distance. This is isolated to the material
      // field only — mechanical impulse above is untouched.
      const px = cx + (CONFIG.baseRadius + p.offset) * Math.cos(p.angle);
      const py = cy + (CONFIG.baseRadius + p.offset) * Math.sin(p.angle);
      const distToPoint = Math.hypot(pointerPos.x - px, pointerPos.y - py);
      let rawTPoint = distToPoint / outer;
      rawTPoint = Math.max(0, Math.min(1, rawTPoint));
      const pointFalloff = Math.pow(1 - rawTPoint, CONFIG.falloffExponent);

      material.inject(i, pointerInside ? pointFalloff : 0);
    }

    material.step();

    // v0.4.3: free glow update — independent of the ring points entirely,
    // so it can flow anywhere the cursor goes, including the interior.
    const cursorEnergyTarget = pointerInside ? 1 : 0;
    const cursorRate = cursorEnergyTarget > cursorEnergy ? CONFIG.lumAttack : CONFIG.lumRelease;
    cursorEnergy += (cursorEnergyTarget - cursorEnergy) * cursorRate;
    cursorGlowX += (pointerPos.x - cursorGlowX) * CONFIG.cursorFollowLag;
    cursorGlowY += (pointerPos.y - cursorGlowY) * CONFIG.cursorFollowLag;

    pointerVel.x *= CONFIG.velocityDecay;
    pointerVel.y *= CONFIG.velocityDecay;
  }


  /* --------------------------------------------------------------------
     RENDERER — reads ONLY point geometry and material.get()/average().
     No reference to pointerPos, pointerVel, or distToPointer exists
     anywhere below this line.
     -------------------------------------------------------------------- */
  function catmullRomToBezierPath(pts) {
    const n = pts.length;
    let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)} `;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n];
      const p1 = pts[i];
      const p2 = pts[(i + 1) % n];
      const p3 = pts[(i + 2) % n];
      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;
      d += `C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} `;
    }
    return d + 'Z';
  }

  const pathEl = document.getElementById('droplet-path');
  const clipPathEl = document.getElementById('droplet-clip-path');
  const glowLayer = document.getElementById('glow-layer');

  function smoothstep(x) {
    x = Math.max(0, Math.min(1, x));
    return x * x * (3 - 2 * x);
  }

  const ambientEl = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  ambientEl.setAttribute('fill', 'url(#glow-blob)');
  glowLayer.appendChild(ambientEl);

  const glowEls = [];
  for (let i = 0; i < CONFIG.pointCount; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('fill', 'url(#glow-blob)');
    glowLayer.appendChild(c);
    glowEls.push(c);
  }

  // v0.4.3: appended last so it renders above the ring blobs — this is
  // the element that can actually be anywhere on the surface.
  const cursorGlowEl = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  cursorGlowEl.setAttribute('fill', 'url(#glow-blob)');
  glowLayer.appendChild(cursorGlowEl);

  function render() {
    const cx = 170, cy = 170;
    const cartesian = points.map(p => {
      const r = CONFIG.baseRadius + p.offset;
      return { x: cx + r * Math.cos(p.angle), y: cy + r * Math.sin(p.angle) };
    });

    const d = catmullRomToBezierPath(cartesian);
    pathEl.setAttribute('d', d);
    clipPathEl.setAttribute('d', d);

    for (let i = 0; i < points.length; i++) {
      const intensity = smoothstep(material.get(i));
      const el = glowEls[i];
      el.setAttribute('cx', cartesian[i].x.toFixed(2));
      el.setAttribute('cy', cartesian[i].y.toFixed(2));
      el.setAttribute('r', (CONFIG.glowRadius * (0.6 + 0.4 * intensity)).toFixed(2));
      el.setAttribute('opacity', intensity.toFixed(3));
    }

    const avgIntensity = smoothstep(material.average());
    ambientEl.setAttribute('cx', cx);
    ambientEl.setAttribute('cy', cy);
    ambientEl.setAttribute('r', CONFIG.ambientRadius);
    ambientEl.setAttribute('opacity', (avgIntensity * 0.5).toFixed(3));

    // v0.4.3: free glow, positioned at the lagged cursor location — the
    // clip-path on glow-layer keeps it strictly inside the heart's
    // silhouette, so it reads as light moving through the material
    // rather than painted on top, even over the interior.
    const cursorIntensity = smoothstep(cursorEnergy);
    cursorGlowEl.setAttribute('cx', cursorGlowX.toFixed(2));
    cursorGlowEl.setAttribute('cy', cursorGlowY.toFixed(2));
    cursorGlowEl.setAttribute('r', (CONFIG.cursorGlowRadius * (0.7 + 0.3 * cursorIntensity)).toFixed(2));
    cursorGlowEl.setAttribute('opacity', (cursorIntensity * 0.65).toFixed(3));
  }


  /* --------------------------------------------------------------------
     ORCHESTRATOR (unchanged)
     -------------------------------------------------------------------- */
  let simTime = 0;
  let accumulator = 0;
  let lastFrameTime = performance.now();
  const MAX_STEPS_PER_FRAME = 8;

  function loop(now) {
    let frameDelta = (now - lastFrameTime) / 1000;
    lastFrameTime = now;
    frameDelta = Math.min(frameDelta, 0.25);
    accumulator += frameDelta;
    let steps = 0;
    while (accumulator >= CONFIG.fixedTimestep && steps < MAX_STEPS_PER_FRAME) {
      simTime += CONFIG.fixedTimestep;
      stepPhysics(simTime, CONFIG.fixedTimestep);
      accumulator -= CONFIG.fixedTimestep;
      steps++;
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);


  /* --------------------------------------------------------------------
     DEBUG PANEL WIRING
     -------------------------------------------------------------------- */
  function bindSlider(id, configKey, format = (v) => v, onChange) {
    const input = document.getElementById(id);
    const label = document.getElementById('val-' + id);
    input.value = CONFIG[configKey];
    label.textContent = format(CONFIG[configKey]);
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      CONFIG[configKey] = v;
      label.textContent = format(v);
      if (onChange) onChange(v);
    });
  }

  bindSlider('stiffness', 'stiffness');
  bindSlider('damping', 'damping');
  bindSlider('impulse', 'impulseScale');
  bindSlider('noise', 'noiseAmplitude');
  bindSlider('influence', 'influenceRadius');
  bindSlider('falloff', 'falloffExponent');
  bindSlider('lumattack', 'lumAttack', (v) => v.toFixed(2), (v) => material.attack = v);
  bindSlider('lumrelease', 'lumRelease', (v) => v.toFixed(3), (v) => material.release = v);
  bindSlider('lumdiffusion', 'lumDiffusion', (v) => v.toFixed(2), (v) => material.diffusion = v);
  bindSlider('glowradius', 'glowRadius');
  bindSlider('ambientradius', 'ambientRadius');
  bindSlider('cursorglowradius', 'cursorGlowRadius');
  bindSlider('cursorfollowlag', 'cursorFollowLag', (v) => v.toFixed(2));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'h') document.getElementById('debug-panel').classList.toggle('hidden');
  });
</script>

</body>
</html>
