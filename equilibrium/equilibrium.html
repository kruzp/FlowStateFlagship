<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowstate OS — Equilibrium Prototype</title>
<style>
  :root {
    --bg: #0a0a0c;
    --accent: #2ee6a6;
    --ink-secondary: #6b6f76;
    --ink-tertiary: #3a3d42;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, "Manrope", system-ui, sans-serif;
  }

  /* Full-viewport pointer-tracking stage. The shape sits centered inside it;
     we listen for pointer movement across the WHOLE stage (not just over the
     shape) so it can respond to "nearby" cursor movement, per spec. */
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none; /* prevent scroll/zoom gestures from eating our touch events */
  }

  #equilibrium-svg {
    width: 340px;
    height: 340px;
    display: block;
    overflow: visible;
  }

  #droplet-path {
    fill: var(--accent);
  }

  /* --- Debug panel: exists ONLY for this tuning-by-feel prototype phase.
     Not part of the eventual component — strip entirely once we lock values. --- */
  #debug-panel {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 12px;
    color: var(--ink-secondary);
    width: 260px;
    backdrop-filter: blur(6px);
  }

  #debug-panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #fff;
    margin: 0 0 12px 0;
    font-weight: 600;
  }

  .control {
    margin-bottom: 12px;
  }

  .control label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .control span {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .control input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  #hint {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--ink-tertiary);
    font-size: 13px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

  <div id="hint">move your cursor near the shape</div>

  <div id="stage">
    <svg id="equilibrium-svg" viewBox="0 0 340 340">
      <path id="droplet-path" d=""></path>
    </svg>
  </div>

  <div id="debug-panel">
    <h2>Tuning — Equilibrium</h2>

    <div class="control">
      <label>Stiffness (k) <span id="val-stiffness"></span></label>
      <input type="range" id="stiffness" min="20" max="400" step="1">
    </div>

    <div class="control">
      <label>Damping (c) <span id="val-damping"></span></label>
      <input type="range" id="damping" min="1" max="60" step="0.5">
    </div>

    <div class="control">
      <label>Impulse strength <span id="val-impulse"></span></label>
      <input type="range" id="impulse" min="0" max="4" step="0.05">
    </div>

    <div class="control">
      <label>Influence radius <span id="val-influence"></span></label>
      <input type="range" id="influence" min="60" max="400" step="5">
    </div>

    <div class="control">
      <label>Idle noise amplitude <span id="val-noise"></span></label>
      <input type="range" id="noise" min="0" max="20" step="0.5">
    </div>
  </div>

<script>
/* ============================================================================
   FLOWSTATE OS — EQUILIBRIUM PRIMITIVE (Prototype v0)
   ----------------------------------------------------------------------------
   This file intentionally flattens the four-layer architecture we agreed on
   (Physics / InputAdapter / SvgRenderer / EquilibriumField orchestrator) into
   one file, for speed of iteration. Each section below is commented with the
   module it will become once we refactor. Nothing here is precious — the
   goal of THIS pass is only to find numbers and behavior that feel right.
   ============================================================================ */


  /* --------------------------------------------------------------------
     CONFIG — every tunable constant lives here. This becomes the public
     API surface of the eventual component (props / preset object).
     -------------------------------------------------------------------- */
  const CONFIG = {
    pointCount: 10,        // control points around the shape
    baseRadius: 80,        // resting radius, in SVG units
    stiffness: 120,        // spring constant (k)
    damping: 14,           // damping coefficient (c) — underdamped by default
    impulseScale: 1.2,     // how strongly pointer speed injects energy
    influenceRadius: 220,  // px beyond which cursor has ~no effect
    noiseAmplitude: 8,     // idle "breathing" displacement, in SVG units
    velocitySmoothing: 0.25, // EMA factor for pointer velocity (0-1, higher = snappier)
    velocityDecay: 0.90,   // per-frame decay applied to pointer velocity when idle
    fixedTimestep: 1 / 120 // physics integrates at a fixed rate, decoupled from display refresh
  };

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Per our agreed interpretation: ambient idle motion is disabled entirely
  // under reduced motion, but direct interaction remains — just attenuated.
  if (reducedMotion) {
    CONFIG.noiseAmplitude = 0;
    CONFIG.impulseScale *= 0.4;
  }


  /* --------------------------------------------------------------------
     NOISE — a small, dependency-free 1D value-noise function.
     This becomes physics/noise.js.

     Why not a plain sine wave: a single oscillator has a fixed period, and
     a patient viewer (or a looping screen recording) will eventually clock
     the repeat. Value noise interpolated between pseudo-random hash values
     has no fixed period within any realistic viewing session.

     This is a cheap "shader-style" hash noise — good enough to prove the
     feel out. If it ever reads as too regular once we're staring at it for
     real, swapping in a proper simplex noise implementation is a drop-in
     replacement for this one function.
     -------------------------------------------------------------------- */
  function hash1(n) {
    const x = Math.sin(n * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  function valueNoise1D(x) {
    const i = Math.floor(x);
    const f = x - i;
    const a = hash1(i);
    const b = hash1(i + 1);
    const u = f * f * (3 - 2 * f); // smoothstep — avoids linear-interpolation kinks
    return a + (b - a) * u; // returns [0, 1)
  }

  // Layered octaves at incommensurate frequencies, so no combined period
  // emerges. `phase` is per-point, so points don't breathe in unison.
  function idleOffset(t, phase) {
    const n1 = valueNoise1D(t * 0.021 + phase) * 2 - 1;
    const n2 = valueNoise1D(t * 0.057 + phase * 1.7) * 2 - 1;
    const n3 = valueNoise1D(t * 0.133 + phase * 2.3) * 2 - 1;
    return (n1 * 1.0 + n2 * 0.5 + n3 * 0.25) / 1.75; // normalized to roughly [-1, 1]
  }


  /* --------------------------------------------------------------------
     POINT STATE — this becomes physics/EquilibriumField state.
     Each point has ONE degree of freedom: radial offset from baseRadius.
     (The shape is roughly circular at rest, so we don't need full x/y
     springs per point — this halves the simulated state.)
     -------------------------------------------------------------------- */
  const points = [];
  for (let i = 0; i < CONFIG.pointCount; i++) {
    points.push({
      angle: (i / CONFIG.pointCount) * Math.PI * 2,
      offset: 0,     // current radial displacement from baseRadius
      velocity: 0,   // current radial velocity
      phase: i * 1.37 // arbitrary per-point phase offset for noise decorrelation
    });
  }


  /* --------------------------------------------------------------------
     INPUT ADAPTER — this becomes input/PointerAdapter.
     Tracks pointer position + a smoothed velocity estimate. We deliberately
     compute VELOCITY (not just position) because the whole interaction
     model is energy-coupled: a slow approach barely disturbs the shape,
     a fast swipe genuinely does. Position alone can't express that.
     -------------------------------------------------------------------- */
  const svg = document.getElementById('equilibrium-svg');
  const stage = document.getElementById('stage');

  let pointerPos = { x: 170, y: 170 }; // in SVG-local coordinates, default = center
  let pointerVel = { x: 0, y: 0 };
  let lastPointerPos = null;
  let lastPointerTime = null;
  let pointerActive = false; // true while touch is down; mouse doesn't need this gate

  function toLocalCoords(clientX, clientY) {
    const rect = svg.getBoundingClientRect();
    // svg is drawn 1:1 with its viewBox (340x340 CSS px == 340x340 viewBox units)
    // so this is a direct subtraction, no scale factor needed.
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function handlePointerMove(clientX, clientY) {
    const now = performance.now();
    const pos = toLocalCoords(clientX, clientY);

    if (lastPointerPos && lastPointerTime) {
      const dt = Math.max((now - lastPointerTime) / 1000, 1 / 240); // guard against dt=0
      const rawVelX = (pos.x - lastPointerPos.x) / dt;
      const rawVelY = (pos.y - lastPointerPos.y) / dt;

      // EMA smoothing so raw event jitter doesn't inject noisy energy into the spring
      pointerVel.x += (rawVelX - pointerVel.x) * CONFIG.velocitySmoothing;
      pointerVel.y += (rawVelY - pointerVel.y) * CONFIG.velocitySmoothing;
    }

    pointerPos = pos;
    lastPointerPos = pos;
    lastPointerTime = now;
  }

  stage.addEventListener('pointermove', (e) => {
    handlePointerMove(e.clientX, e.clientY);
  });

  stage.addEventListener('pointerdown', () => { pointerActive = true; });
  stage.addEventListener('pointerup', () => { pointerActive = false; });
  stage.addEventListener('pointerleave', () => { pointerActive = false; });

  // Touch: same handler, but influence only applies while a finger is
  // actually down — there's no "hover" equivalent on touch, so we don't
  // fake one. Idle breathing continues regardless of touch state.
  stage.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (t) handlePointerMove(t.clientX, t.clientY);
  }, { passive: true });


  /* --------------------------------------------------------------------
     PHYSICS STEP — this becomes physics/EquilibriumField.step().
     Semi-implicit (symplectic) Euler integration — more stable than naive
     Euler for spring systems, and cheap enough not to matter performance-
     wise. Runs at a FIXED timestep (see the accumulator loop below) so
     behavior doesn't change with display refresh rate.
     -------------------------------------------------------------------- */
  function stepPhysics(t, dt) {
    const cx = 170, cy = 170; // shape center, in SVG-local coordinates

    // Direction + distance from shape center to current pointer position —
    // computed once per step, reused for every point's alignment check.
    const dx = pointerPos.x - cx;
    const dy = pointerPos.y - cy;
    const distToPointer = Math.hypot(dx, dy);
    const pointerDirX = distToPointer > 0.001 ? dx / distToPointer : 0;
    const pointerDirY = distToPointer > 0.001 ? dy / distToPointer : 0;
    const pointerSpeed = Math.hypot(pointerVel.x, pointerVel.y);

    // Smooth falloff from full influence at the shape's edge to zero at
    // influenceRadius. No hard cutoff — a soft edge reads as noticing
    // the cursor gradually, not at an exact pixel boundary.
    const edge = CONFIG.baseRadius;
    const outer = CONFIG.influenceRadius;
    let falloff = 1 - (distToPointer - edge) / (outer - edge);
    falloff = Math.max(0, Math.min(1, falloff));
    falloff = falloff * falloff * (3 - 2 * falloff); // smoothstep

    for (const p of points) {
      // --- idle target: where this point "wants" to rest, before any
      // interaction is considered. Noise-driven, per-point phase, so the
      // shape never settles into a perfectly still or obviously repeating
      // pose.
      const idleTarget = reducedMotion ? 0 : idleOffset(t, p.phase) * CONFIG.noiseAmplitude;

      // --- spring + damper toward idle target
      const displacement = p.offset - idleTarget;
      const springForce = -CONFIG.stiffness * displacement;
      const dampingForce = -CONFIG.damping * p.velocity;
      let accel = springForce + dampingForce; // mass = 1

      // --- energy injection from pointer motion. Only points whose
      // outward direction roughly faces the pointer are affected
      // (alignment > 0) — this is what makes only the NEAR side of the
      // shape reach toward the cursor, not the whole perimeter uniformly.
      const pointDirX = Math.cos(p.angle);
      const pointDirY = Math.sin(p.angle);
      const alignment = pointDirX * pointerDirX + pointDirY * pointerDirY;

      if (alignment > 0 && distToPointer < outer) {
        const impulse = pointerSpeed * alignment * falloff * CONFIG.impulseScale;
        // Applied as a force (scaled by dt below via velocity integration),
        // not a direct position set — this is the energy-coupling model:
        // we're injecting momentum and letting the spring resolve it,
        // not dictating the resulting shape directly.
        accel += impulse;
      }

      p.velocity += accel * dt;
      p.offset += p.velocity * dt;
    }

    // Pointer velocity decays when no new pointer events arrive (e.g.
    // cursor stopped moving but is still hovering) — otherwise a single
    // fast movement would keep injecting energy forever.
    pointerVel.x *= CONFIG.velocityDecay;
    pointerVel.y *= CONFIG.velocityDecay;
  }


  /* --------------------------------------------------------------------
     RENDERER — this becomes render/SvgRenderer.
     Converts point state -> Cartesian coordinates -> a smooth closed path
     via Catmull-Rom-to-Bezier conversion. This is what makes N discrete
     points read as one continuous organic form instead of a soft polygon.
     -------------------------------------------------------------------- */
  function catmullRomToBezierPath(pts) {
    const n = pts.length;
    let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)} `;

    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n];
      const p1 = pts[i];
      const p2 = pts[(i + 1) % n];
      const p3 = pts[(i + 2) % n];

      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;

      d += `C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} `;
    }
    return d + 'Z';
  }

  const pathEl = document.getElementById('droplet-path');

  function render() {
    const cx = 170, cy = 170;
    const cartesian = points.map(p => {
      const r = CONFIG.baseRadius + p.offset;
      return {
        x: cx + r * Math.cos(p.angle),
        y: cy + r * Math.sin(p.angle)
      };
    });
    pathEl.setAttribute('d', catmullRomToBezierPath(cartesian));
  }


  /* --------------------------------------------------------------------
     ORCHESTRATOR — this becomes EquilibriumField (the public component).
     Fixed-timestep accumulator loop: physics always advances in identical
     increments regardless of actual frame rate, so the same interaction
     feels the same on a 60Hz laptop and a 120Hz phone, and doesn't
     destabilize on a frame hitch.
     -------------------------------------------------------------------- */
  let simTime = 0;
  let accumulator = 0;
  let lastFrameTime = performance.now();
  const MAX_STEPS_PER_FRAME = 8; // safety cap against the "spiral of death"

  function loop(now) {
    let frameDelta = (now - lastFrameTime) / 1000;
    lastFrameTime = now;
    frameDelta = Math.min(frameDelta, 0.25); // clamp huge pauses (tab switch, etc.)

    accumulator += frameDelta;
    let steps = 0;
    while (accumulator >= CONFIG.fixedTimestep && steps < MAX_STEPS_PER_FRAME) {
      simTime += CONFIG.fixedTimestep;
      stepPhysics(simTime, CONFIG.fixedTimestep);
      accumulator -= CONFIG.fixedTimestep;
      steps++;
    }

    render();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);


  /* --------------------------------------------------------------------
     DEBUG PANEL WIRING — prototype-only, deleted before this becomes a
     real component. Lets us tune by feel without touching code.
     -------------------------------------------------------------------- */
  function bindSlider(id, configKey, format = (v) => v) {
    const input = document.getElementById(id);
    const label = document.getElementById('val-' + id);
    input.value = CONFIG[configKey];
    label.textContent = format(CONFIG[configKey]);
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      CONFIG[configKey] = v;
      label.textContent = format(v);
    });
  }

  bindSlider('stiffness', 'stiffness');
  bindSlider('damping', 'damping');
  bindSlider('impulse', 'impulseScale');
  bindSlider('influence', 'influenceRadius');
  bindSlider('noise', 'noiseAmplitude');
</script>

</body>
</html>
