<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Material — v2.0</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #050505;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #fallback {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        color: #ccc;
        font-family: sans-serif;
        font-size: 16px;
        background: #050505;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="fallback">Your browser does not support WebGL2. Flow Material requires a WebGL2-capable browser.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
